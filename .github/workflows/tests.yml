name: tests

on:
  push:
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*', '13.*']
        exclude:
          - php: '8.2'
            laravel: '13.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, zlib
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/http:${{ matrix.laravel }}" --no-interaction --no-update
          if [ "${{ matrix.laravel }}" = "11.*" ]; then
            # Temporary workaround: Laravel 11 currently resolves to advisory-flagged versions.
            # This bypass is limited to the Laravel 11 job and should be removed once secure releases are available.
            composer update --prefer-dist --no-interaction --no-security-blocking
          else
            composer update --prefer-dist --no-interaction
          fi

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Run benchmark (fidelity check)
        run: php bin/benchmark.php
